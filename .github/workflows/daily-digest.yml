name: Daily PostHog digest to Slack

on:
  schedule:
    # 13:00 UTC = 9am America/New_York during EDT.
    # GitHub cron has no DST awareness, so this drifts to 8am ET in winter.
    # Change to '0 14 * * *' when the clocks go back if 9am matters.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post digest
        env:
          # The repo secret names do not match what they hold. Mapping, confirmed
          # by Martin: POTSHOT_TO_SLACK_GROWTH is the PostHog API key, and
          # POSTHOG_SLACK_KEY_GROWTH is the Slack webhook URL. Worth renaming
          # both one day; until then do not "fix" these by matching on the name.
          POSTHOG_API_KEY: ${{ secrets.POTSHOT_TO_SLACK_GROWTH }}
          SLACK_WEBHOOK_URL: ${{ secrets.POSTHOG_SLACK_KEY_GROWTH }}
        run: python3 digest.py
